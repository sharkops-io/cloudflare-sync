{{- $secret := include "cloudflare-sync.tokenSecret" . -}}
{{- if $secret }}
# Exactly the one Secret the tunnel's run token goes to. `create` cannot be
# limited to a name (the object does not exist yet), so it covers Secrets in
# that namespace; give the tunnel a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloudflare-sync.fullname" . }}
  namespace: {{ include "cloudflare-sync.tokenSecretNamespace" . }}
  labels:
    {{- include "cloudflare-sync.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $secret | quote }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloudflare-sync.fullname" . }}
  namespace: {{ include "cloudflare-sync.tokenSecretNamespace" . }}
  labels:
    {{- include "cloudflare-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloudflare-sync.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cloudflare-sync.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
