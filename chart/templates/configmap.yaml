{{- if .Values.config }}
{{- include "cloudflare-sync.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudflare-sync.fullname" . }}
  labels:
    {{- include "cloudflare-sync.labels" . | nindent 4 }}
data:
  config.json: |
    {{- .Values.config | toPrettyJson | nindent 4 }}
{{- end }}
